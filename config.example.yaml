  #  backend: github-copilot
  #  options:
  #    github_token: ${COPILOT_GITHUB_TOKEN}
  #  default_model: gpt-5.3-codex
  #  # model_map: { gpt-5: gpt-5.3-codex }
  #  # base_url: https://api.githubcopilot.com  # 可选固定 endpoint
