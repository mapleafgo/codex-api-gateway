# =============================================================================
# CodexApiGateway 配置示例（Config v2）
# -----------------------------------------------------------------------------
# 作用：把 Codex CLI 的 OpenAI Responses 请求，按源 stable backend 适配到：
#       anthropic = Anthropic Messages、openai-chat = OpenAI Chat Completions、
#       github-copilot = GitHub Copilot（按模型自动路由 r/a/c）、
#       openai-responses = OpenAI Responses 透传；多源主备故障转移 + 断路器。
# 约定：api_key 与 options 内敏感值支持 ${ENV_VAR} 从环境变量展开，
#       避免明文密钥入库。
# 旧 backend_type 短码（a/c/g/r）已废弃，统一用稳定 backend 标识。
# =============================================================================

# HTTP 服务
server:
  listen: ":8383"        # 监听地址；Codex 的 base_url 指向 http://<host>:8383/v1
  # 本机防误伤（非公网高并发限流）：
  max_body_mb: 32              # /v1/responses 请求体上限（MiB），超限返回 413
  read_header_timeout: 10s     # 读完请求头超时；不影响已建立的 SSE 长流

# 日志配置
# level: debug | info | warn | error
# format: text | json
# file: 非空时日志写入该文件（追加），为空写 stderr。排查时配合 level: debug。
# debug 会输出输入项、流式事件、SSE 转换等细粒度诊断日志。
# max_size_mb / max_backups：仅 file 模式生效，防止 gateway.log 无限膨胀。
logging:
  level: info
  format: text
  # file: gateway.log
  # max_size_mb: 50
  # max_backups: 3

# 全局断路器（所有后端源共享，可被单源 breaker 覆盖）
# 状态机：
#   normal ──(连续 N 次失败)──> degraded(该源序列后移)
#   degraded ──(超过 degrade_interval 无新失败)──> 恢复到原始优先级位置（进入机会窗口，状态仍保持 degraded）
#   degraded 机会窗口内 ──(真实请求成功 degraded_recovery_threshold 次)──> normal
#   degraded 机会窗口内 ──(失败)──> 重新移到队尾等下一次机会；连续 N 次机会失败 ──> circuitOpen(熔断)
#   circuitOpen ──(circuit_interval 结束)──> halfOpen(放行探测) ──(探测成功)──> 由 recovery 决定回到 normal/degraded
breaker:
  first_byte_timeout: 12s   # 流式请求等待首个字节的最长时间，超时计为失败
  request_timeout: 120s     # 单个源单笔上游调用的总时长上限（不被首个事件停止）
                            # 0/缺省 = 120s，负值拒绝；未出内容时按失败换源，
                            # 已出内容时以 failed 终态收口
  degrade_threshold: 3      # normal→degraded 需连续 N 次失败；degraded 机会窗口累计 N 次失败（中间无成功）→ circuitOpen
  degrade_interval: 1m      # degraded 源超过此间隔无新失败则恢复到原始优先级进入机会窗口
  degraded_recovery_threshold: 1      # degraded 恢复到 normal 所需的连续成功次数（降级恢复阈值）
  circuit_interval: 30m     # 熔断(circuitOpen)后多久转为半开(halfOpen)探测
  circuit_recovery_threshold: 1       # halfOpen 恢复到 normal/degraded 所需的连续探测成功次数（熔断恢复阈值）
  recovery: normal          # halfOpen 探测成功后恢复到 normal | degraded
  max_retries: 0            # 所有源全部失败后的整轮重试次数（0=不重试）；仅全局生效，不被单源 breaker 覆盖

# 顶层 anthropic 段已移除。default_max_tokens / cache_enabled 改为在
# anthropic 源的 options 中声明（见下方 anthropic-official 示例的 options）。

#
# 基线指令（base_instructions.md）：与本配置文件同级放置，不在 YAML 中配置路径。
# 文件非空时作为 Codex ModelInfo.base_instructions 返回，整体替换内置 BASE_INSTRUCTIONS
# （客户端注入 system 前缀，prompt cache 友好）。缺失则沿用 Codex 内置指令。
# 管理页「基线指令」标签即编辑该文件。

# /v1/models 暴露的模型表。key 是模型 slug（即客户端可用的模型名），value 是
# per-slug 能力覆盖；只返回在此显式列出的模型，不合并上游 /v1/models 列表，
# 也不暴露 sources.model_map 的别名。
# 网关不向上游拉取模型列表，context_window 等能力字段必须在此显式补充。
# 仅 context_window / accepts_image / supports_image_detail_original 可 per-slug 覆盖；
# 其余能力（parallel_tool_calls / reasoning_summaries / web_search_tool_type /
# use_responses_lite 等）由 codexModelInfo 硬编码统一注入。
# supports_search_tool 始终返回 true（client-side standalone 搜索开关，关闭也无法
# 阻止 hosted web search，故不开放覆盖）。
# models:
#   gpt-5.5:                        # slug，客户端请求时使用的模型名
#     context_window: 200000        # 最大上下文 token 数（同步到 max_context_window）
#     # accepts_image: false        # false 时禁止图片输入（input_modalities 仅 text），默认 true
#     # supports_image_detail_original: true  # true 时发送原图分辨率不压缩，默认 false
#   glm-5.2:
#     context_window: 131072

# 后端源列表（顺序即优先级：第一个为主用，其余依次作为主备故障转移的备用源）
# base_url 只写到网关根地址（不含 /v1/messages），代码内部统一补全该路径。
# backend 必须是已注册插件稳定 ID：anthropic / openai-chat / openai-responses /
# github-copilot。options 只能含所选插件 schema 声明的键。
# supports_web_search：该源是否支持 hosted web_search 工具。不支持时网关会在转发前
# 剥掉 web_search 工具声明，避免上游不认识导致 400/断流。nil 时按 backend 默认：
# anthropic/openai-responses 默认支持（true），仅 openai-chat 默认不支持（false）。
sources:
  - name: anthropic-official                # 源标识，用于日志与故障转移定位
    backend: anthropic                      # 稳定插件 ID
    base_url: https://api.anthropic.com     # 网关根地址，代码自动补 /v1/messages
    api_key: ${ANTHROPIC_KEY}               # 密钥，支持 ${ENV_VAR} 展开
    options:
      default_max_tokens: 16384             # 客户端未传 max_output_tokens 时的输出额度
      cache_enabled: true                   # 自动注入 Anthropic prompt cache（TTL 固定 5m）
    model_map: { gpt-5: claude-sonnet-4-20250514 }  # 请求 model → 后端 model 映射
    default_model: claude-sonnet-4-20250514 # 未命中 model_map 时的兜底模型（如 Codex 的 gpt-5.5）
    # supports_web_search: true             # 可选覆盖；默认按 backend（anthropic/responses=true、chat=false）
    # disabled: true                        # 人工停用：true 时不参与调度；管理页可即时切换
    # headers:                              # 可选：追加到上游请求的自定义 header（如 X-Api-Key、anthropic-beta 覆盖）
    #   X-Custom: value                     # 保留头（content-type/authorization/accept/x-api-key/anthropic-version/anthropic-beta）不可被覆盖，会被跳过（Debug 记录）

  # 备用源：演示 per-source 断路器覆盖（整个 breaker 块可选，省略即用全局）
  # 单源 breaker 中为零值的字段会继承全局；max_retries 始终取全局、不被覆盖。
  - name: zhipu
    backend: anthropic
    base_url: https://open.bigmodel.cn/api/anthropic
    api_key: ${ZHIPU_KEY}
    model_map: { gpt-5: glm-5.2 }
    default_model: glm-5.2
    breaker:
      first_byte_timeout: 8s    # 该源更快判定首字节超时，其余字段继承全局
      # request_timeout: 90s    # 可选覆盖单笔总时长；0/缺省继承全局

  # 备用源：演示 OpenAI Chat 兼容上游（取消注释使用）
  #- name: openai-compat
  #  base_url: https://api.openai.com/v1
  #  api_key: ${OPENAI_API_KEY}
  #  backend: openai-chat
  #  model_map: { gpt-5: gpt-4o }
  #  default_model: gpt-4o

  # 备用源：演示 OpenAI Responses 透传上游（取消注释使用）
  #- name: openai-responses
  #  base_url: https://api.openai.com/v1
  #  api_key: ${OPENAI_API_KEY}
  #  backend: openai-responses
  #  model_map: { gpt-5: gpt-5 }
  #  default_model: gpt-5

  # 备用源：GitHub Copilot 原生接入（取消注释使用）
  # 认证参照 Zed：直接用 GitHub OAuth token 作为 Bearer 调 Copilot API。
  # 上游地址默认由 GraphQL 动态发现（失败回退 https://api.githubcopilot.com）。
  # base_url 可省略；显式填写时作为固定 endpoint，跳过发现。按模型
  # supported_endpoints 自动路由到 r > a > c 转换路径。
